<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AA INFO</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#0f4c81">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
color:#222;
padding-bottom:90px;
}

header{
background:#0f4c81;
color:white;
padding:18px;
font-size:22px;
font-weight:bold;
text-align:center;
}

.container{
padding:15px;
}

.cards{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:20px;
}

.card{
background:white;
padding:15px;
border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
text-align:center;
}

.card h2{
margin-top:8px;
font-size:26px;
color:#0f4c81;
}

.search-box input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
margin-bottom:15px;
font-size:16px;
}

.filters{
display:flex;
gap:10px;
margin-bottom:15px;
overflow:auto;
}

.filters button{
padding:10px 14px;
border:none;
border-radius:10px;
background:#dce9f7;
cursor:pointer;
white-space:nowrap;
}

.filters button.active{
background:#0f4c81;
color:white;
}

.site-list{
display:flex;
flex-direction:column;
gap:10px;
}

.site-card{
background:white;
padding:14px;
border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.site-card h3{
margin-bottom:8px;
color:#0f4c81;
}

.site-card p{
margin:4px 0;
font-size:14px;
}

input,select,textarea{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:1px solid #ccc;
}

textarea{
resize:none;
}

.btn{
background:#0f4c81;
color:white;
border:none;
padding:12px;
width:100%;
border-radius:10px;
margin-top:12px;
cursor:pointer;
}

.fab{
position:fixed;
right:20px;
bottom:80px;
width:60px;
height:60px;
border-radius:50%;
background:#0f4c81;
color:white;
border:none;
font-size:28px;
cursor:pointer;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:10px 0;
box-shadow:0 -2px 6px rgba(0,0,0,0.1);
}

.bottom-nav button{
background:none;
border:none;
display:flex;
flex-direction:column;
align-items:center;
font-size:12px;
color:#666;
}

.bottom-nav button.active{
color:#0f4c81;
font-weight:bold;
}

.page{
display:none;
}

.page.active{
display:block;
}

.latest{
margin-top:20px;
}

.latest h3{
margin-bottom:10px;
}

@media(max-width:700px){

.cards{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<header>AA INFO</header>

<!-- DASHBOARD -->
<div class="container page active" id="dashboardPage">

<div class="cards">

<div class="card">
<div>Total Sites</div>
<h2 id="totalSites">0</h2>
</div>

<div class="card">
<div>AA YES</div>
<h2 id="aaYes">0</h2>
</div>

<div class="card">
<div>AA NO</div>
<h2 id="aaNo">0</h2>
</div>

</div>

<div class="search-box">
<input type="text" id="searchInput"
placeholder="Search Site ID">
</div>

<div class="filters">
<button class="filterBtn active" data-filter="all">
All
</button>

<button class="filterBtn" data-filter="Yes">
AA YES
</button>

<button class="filterBtn" data-filter="No">
AA NO
</button>
</div>

<div class="site-list" id="dashboardList"></div>

<div class="latest">
<h3>Latest Updated Sites</h3>
<div class="site-list" id="latestList"></div>
</div>

</div>

<!-- SITE MANAGEMENT -->
<div class="container page" id="sitePage">

<h2>Site Management</h2>

<input type="text" id="siteId"
placeholder="Enter Site ID">

<select id="aaStatus">
<option value="Yes">AA YES</option>
<option value="No">AA NO</option>
</select>

<textarea id="siteNotes"
rows="4"
placeholder="Enter Notes"></textarea>

<button class="btn" onclick="saveSite()">
Save Site
</button>

</div>

<!-- CERTIFICATE PAGE -->
<div class="container page" id="certificatePage">

<h2>AA Certificate Record</h2>

<input type="text"
id="certSiteId"
placeholder="Enter Site ID">

<select id="certStatus">
<option value="Yes">YES</option>
<option value="No">NO</option>
</select>

<button class="btn"
onclick="saveCertificate()">
Save Certificate
</button>

<br><br>

<div id="certificateList"
class="site-list"></div>

</div>

<!-- SETTINGS -->
<div class="container page" id="settingsPage">

<h2>Settings & Backup</h2>

<button class="btn" onclick="exportJSON()">
Export JSON Backup
</button>

<input type="file" id="importFile">

<button class="btn" onclick="importJSON()">
Import JSON Backup
</button>

<button class="btn" onclick="printSummary()">
Print Summary
</button>

<button class="btn" onclick="clearAllData()">
Clear All Data
</button>

<button class="btn" onclick="resetDB()">
Reset IndexedDB Database
</button>

</div>

<button class="fab"
onclick="openPage('sitePage')">
+
</button>

<div class="bottom-nav">

<button class="active"
onclick="switchTab(this,'dashboardPage')">
<i class="fa fa-home"></i>
Dashboard
</button>

<button onclick="switchTab(this,'sitePage')">
<i class="fa fa-building"></i>
Sites
</button>

<button onclick="switchTab(this,'certificatePage')">
<i class="fa fa-file"></i>
Certificate
</button>

<button onclick="switchTab(this,'settingsPage')">
<i class="fa fa-gear"></i>
Settings
</button>

</div>

<script>

let db;

const request = indexedDB.open("AAINFO_DB",2);

request.onupgradeneeded = function(e){

db = e.target.result;

if(!db.objectStoreNames.contains("sites")){
db.createObjectStore("sites",{keyPath:"siteId"});
}

if(!db.objectStoreNames.contains("certificates")){
db.createObjectStore("certificates",{keyPath:"siteId"});
}

};

request.onsuccess = function(e){

db = e.target.result;

loadSites();
loadCertificates();

};

function saveSite(){

const siteId =
document.getElementById("siteId").value.trim();

const aaStatus =
document.getElementById("aaStatus").value;

const notes =
document.getElementById("siteNotes").value;

if(!siteId){
alert("Enter Site ID");
return;
}

const tx =
db.transaction("sites","readwrite");

const store =
tx.objectStore("sites");

store.put({
siteId,
aaStatus,
notes,
updated:new Date().toISOString()
});

tx.oncomplete = ()=>{

alert("Site Saved");

document.getElementById("siteId").value="";
document.getElementById("siteNotes").value="";

loadSites();

};

}

function loadSites(){

const tx =
db.transaction("sites","readonly");

const store =
tx.objectStore("sites");

const req =
store.getAll();

req.onsuccess = ()=>{

const data = req.result;

document.getElementById("totalSites")
.innerText = data.length;

document.getElementById("aaYes")
.innerText =
data.filter(x=>x.aaStatus==="Yes").length;

document.getElementById("aaNo")
.innerText =
data.filter(x=>x.aaStatus==="No").length;

renderDashboard(data);
renderLatest(data);

};

}

function renderDashboard(data){

const list =
document.getElementById("dashboardList");

list.innerHTML="";

data.forEach(site=>{

const div =
document.createElement("div");

div.className="site-card";

div.innerHTML=`

<h3>${site.siteId}</h3>

<p>AA Status: ${site.aaStatus}</p>

<p>${site.notes || ""}</p>

<button class="btn"
onclick="generatePDF('${site.siteId}')">
Generate PDF
</button>

<button class="btn"
onclick="shareWhatsApp('${site.siteId}')">
WhatsApp Share
</button>

`;

list.appendChild(div);

});

}

function renderLatest(data){

const latest =
[...data]
.sort((a,b)=>
new Date(b.updated)-new Date(a.updated))
.slice(0,5);

const list =
document.getElementById("latestList");

list.innerHTML="";

latest.forEach(site=>{

const div =
document.createElement("div");

div.className="site-card";

div.innerHTML=`
<h3>${site.siteId}</h3>
<p>${new Date(site.updated)
.toLocaleString()}</p>
`;

list.appendChild(div);

});

}

function saveCertificate(){

const siteId =
document.getElementById("certSiteId").value;

const status =
document.getElementById("certStatus").value;

if(!siteId){
alert("Enter Site ID");
return;
}

const tx =
db.transaction("certificates","readwrite");

const store =
tx.objectStore("certificates");

store.put({
siteId,
status,
updated:new Date().toISOString()
});

tx.oncomplete = ()=>{

alert("Certificate Saved");

document.getElementById("certSiteId").value="";

loadCertificates();

};

}

function loadCertificates(){

const tx =
db.transaction("certificates","readonly");

const store =
tx.objectStore("certificates");

const req =
store.getAll();

req.onsuccess = ()=>{

const data = req.result;

const list =
document.getElementById("certificateList");

list.innerHTML="";

data.forEach(cert=>{

const div =
document.createElement("div");

div.className="site-card";

div.innerHTML=`

<h3>${cert.siteId}</h3>

<p>Certificate: ${cert.status}</p>

`;

list.appendChild(div);

});

};

}

function generatePDF(siteId){

const tx =
db.transaction("sites","readonly");

const store =
tx.objectStore("sites");

const req =
store.get(siteId);

req.onsuccess = ()=>{

const site = req.result;

const { jsPDF } = window.jspdf;

const doc = new jsPDF();

doc.text("AA INFO REPORT",20,20);

doc.text("Site ID: "+site.siteId,20,40);

doc.text("AA Status: "+site.aaStatus,20,50);

doc.text("Notes: "+site.notes,20,60);

doc.save(site.siteId+".pdf");

};

}

function shareWhatsApp(siteId){

const tx =
db.transaction("sites","readonly");

const store =
tx.objectStore("sites");

const req =
store.get(siteId);

req.onsuccess = ()=>{

const site = req.result;

const text =
`AA INFO

Site ID: ${site.siteId}

AA Status: ${site.aaStatus}

Notes: ${site.notes}`;

window.open(
"https://wa.me/?text="+
encodeURIComponent(text),
"_blank"
);

};

}

function exportJSON(){

const tx1 =
db.transaction("sites","readonly");

const tx2 =
db.transaction("certificates","readonly");

const store1 =
tx1.objectStore("sites");

const store2 =
tx2.objectStore("certificates");

const req1 = store1.getAll();
const req2 = store2.getAll();

req1.onsuccess = ()=>{
req2.onsuccess = ()=>{

const backup = {
sites:req1.result,
certificates:req2.result
};

const blob =
new Blob(
[JSON.stringify(backup,null,2)],
{type:"application/json"}
);

const a =
document.createElement("a");

a.href =
URL.createObjectURL(blob);

a.download =
"aa-info-backup.json";

a.click();

};
};

}

function importJSON(){

const file =
document.getElementById("importFile")
.files[0];

if(!file){
alert("Select JSON file");
return;
}

const reader =
new FileReader();

reader.onload = function(){

const data =
JSON.parse(reader.result);

const tx1 =
db.transaction("sites","readwrite");

const tx2 =
db.transaction("certificates","readwrite");

const store1 =
tx1.objectStore("sites");

const store2 =
tx2.objectStore("certificates");

data.sites.forEach(x=>store1.put(x));

data.certificates.forEach(x=>store2.put(x));

alert("Import Success");

loadSites();
loadCertificates();

};

reader.readAsText(file);

}

function clearAllData(){

if(confirm("Clear all data?")){

const tx1 =
db.transaction("sites","readwrite");

const tx2 =
db.transaction("certificates","readwrite");

tx1.objectStore("sites").clear();

tx2.objectStore("certificates").clear();

alert("All Data Cleared");

loadSites();
loadCertificates();

}

}

function resetDB(){

indexedDB.deleteDatabase("AAINFO_DB");

alert("Database Reset");

location.reload();

}

function printSummary(){
window.print();
}

function openPage(page){

document.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"));

document.getElementById(page)
.classList.add("active");

}

function switchTab(btn,page){

document.querySelectorAll(".bottom-nav button")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

openPage(page);

}

document.getElementById("searchInput")
.addEventListener("input",function(){

const value =
this.value.toLowerCase();

const tx =
db.transaction("sites","readonly");

const store =
tx.objectStore("sites");

const req =
store.getAll();

req.onsuccess = ()=>{

const filtered =
req.result.filter(site=>
site.siteId.toLowerCase()
.includes(value)
);

renderDashboard(filtered);

};

});

document.querySelectorAll(".filterBtn")
.forEach(btn=>{

btn.addEventListener("click",()=>{

document.querySelectorAll(".filterBtn")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

const filter =
btn.dataset.filter;

const tx =
db.transaction("sites","readonly");

const store =
tx.objectStore("sites");

const req =
store.getAll();

req.onsuccess = ()=>{

let data = req.result;

if(filter!=="all"){
data =
data.filter(x=>
x.aaStatus===filter
);
}

renderDashboard(data);

};

});

});

if("serviceWorker" in navigator){
navigator.serviceWorker.register("sw.js");
}

</script>

</body>
</html>
